name: ai-rpg-local

x-app: &app
  build: .
  image: ai-rpg-local:dev
  init: true
  environment: &app-environment
    AIRPG_DATABASE_URL: postgresql+psycopg://airpg:airpg@db:5432/airpg
    AIRPG_REGISTRATION_ENABLED: ${AIRPG_REGISTRATION_ENABLED:-false}
    AIRPG_ADMIN_PRINCIPAL_IDS: ${AIRPG_ADMIN_PRINCIPAL_IDS:-}
    AIRPG_DAILY_TURN_LIMIT: ${AIRPG_DAILY_TURN_LIMIT:-100}
    AIRPG_DAILY_STORY_LIMIT: ${AIRPG_DAILY_STORY_LIMIT:-10}
    AIRPG_DAILY_STORY_VALIDATION_LIMIT: ${AIRPG_DAILY_STORY_VALIDATION_LIMIT:-50}
    AIRPG_DAILY_AUTHORING_JOB_LIMIT: ${AIRPG_DAILY_AUTHORING_JOB_LIMIT:-20}
    AIRPG_DAILY_GAME_LLM_LIMIT: ${AIRPG_DAILY_GAME_LLM_LIMIT:-300}
    AIRPG_DAILY_AUTHORING_LLM_LIMIT: ${AIRPG_DAILY_AUTHORING_LLM_LIMIT:-100}
    AIRPG_DAILY_GLOBAL_LLM_LIMIT: ${AIRPG_DAILY_GLOBAL_LLM_LIMIT:-5000}
    AIRPG_CONCURRENT_TURN_LIMIT: ${AIRPG_CONCURRENT_TURN_LIMIT:-3}
    AIRPG_CONCURRENT_AUTHORING_JOB_LIMIT: ${AIRPG_CONCURRENT_AUTHORING_JOB_LIMIT:-2}
    AIRPG_BACKGROUND_MODEL: ${AIRPG_BACKGROUND_MODEL:-${AIRPG_LLM_MODEL:-google:gemini-3.5-flash}}
    AIRPG_AUTHORING_TIMEOUT_SECONDS: ${AIRPG_AUTHORING_TIMEOUT_SECONDS:-60}
    AIRPG_AUTHORING_LEASE_SECONDS: ${AIRPG_AUTHORING_LEASE_SECONDS:-90}
    AIRPG_AUTHORING_MAX_PROMPT_BYTES: ${AIRPG_AUTHORING_MAX_PROMPT_BYTES:-128000}
    AIRPG_AUTHORING_MAX_OUTPUT_TOKENS: ${AIRPG_AUTHORING_MAX_OUTPUT_TOKENS:-8192}
    AIRPG_AUTHORING_MAX_TOTAL_TOKENS: ${AIRPG_AUTHORING_MAX_TOTAL_TOKENS:-24000}
    AIRPG_AUTHORING_MAX_RUNNING: ${AIRPG_AUTHORING_MAX_RUNNING:-4}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airpg
      POSTGRES_PASSWORD: airpg
      POSTGRES_DB: airpg
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airpg -d airpg"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app
    restart: "no"
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        socat TCP-LISTEN:8000,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:8001 &
        exec ai-rpg api --host 127.0.0.1 --port 8001 --dev-principal
    ports:
      - "127.0.0.1:${AIRPG_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  resolution-worker:
    <<: *app
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: [ai-rpg, resolution-worker]

  narration-worker:
    <<: *app
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: [ai-rpg, narration-worker]

  authoring-worker:
    <<: *app
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: [ai-rpg, authoring-worker]

volumes:
  postgres-data:
