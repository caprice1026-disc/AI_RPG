<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI_RPG — 物語を始める</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #0d1a2b;
      --panel-2: #112238;
      --line: #29415d;
      --text: #e8edf5;
      --muted: #91a3b9;
      --cyan: #72d5d0;
      --cyan-dark: #173f49;
      --amber: #f0b35a;
      --danger: #ff9b8f;
      --focus: #b2f5f1;
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 68% -10%, rgba(52, 139, 159, .18), transparent 35rem),
        linear-gradient(rgba(114, 213, 208, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(114, 213, 208, .025) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 42px 42px, 42px 42px, auto;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .topbar {
      min-height: 76px;
      padding: 16px clamp(18px, 4vw, 56px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 17, 31, .88);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: baseline; gap: 16px; }
    .brand strong {
      font: 600 1.7rem/1 Georgia, "Yu Mincho", serif;
      letter-spacing: .17em;
    }
    .brand span { color: var(--muted); font-size: .83rem; }
    .connection { display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .connection-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
      box-shadow: 0 0 0 4px rgba(145, 163, 185, .08);
    }
    .connection[data-state="ok"] { color: var(--cyan); }
    .connection[data-state="ok"] .connection-dot { background: var(--cyan); }
    .connection[data-state="error"] { color: var(--danger); }
    .connection[data-state="error"] .connection-dot { background: var(--danger); }

    .shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(420px, 1fr) minmax(210px, 260px);
      gap: 16px;
      max-width: 1500px;
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(17, 34, 56, .97), rgba(10, 24, 40, .97));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .16);
    }

    .setup, .turn-panel { padding: 22px; }
    h1, h2, h3, p { margin-top: 0; }
    h2 { font: 600 1.25rem/1.3 Georgia, "Yu Mincho", serif; letter-spacing: .03em; }
    .hint { color: var(--muted); font-size: .88rem; line-height: 1.65; }
    .field { margin-top: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: .9rem; }
    input, textarea {
      width: 100%;
      color: var(--text);
      border: 1px solid #46617e;
      border-radius: 9px;
      background: rgba(5, 15, 27, .7);
      transition: border-color .15s, box-shadow .15s;
    }
    input { padding: 11px 12px; }
    textarea { min-height: 92px; padding: 13px 14px; resize: vertical; line-height: 1.55; }
    input:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(114, 213, 208, .12); }
    .field small { display: block; margin-top: 7px; color: var(--muted); line-height: 1.45; }

    .story {
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr) auto;
      min-height: calc(100vh - 112px);
      overflow: hidden;
    }
    .story-head { padding: 22px 24px 17px; border-bottom: 1px solid var(--line); }
    .story-head h1 { margin-bottom: 5px; font: 600 1.5rem/1.2 Georgia, "Yu Mincho", serif; }
    .story-head p { margin: 0; color: var(--muted); font-size: .88rem; }
    .timeline {
      margin: 0;
      padding: 22px 24px;
      overflow-y: auto;
      list-style: none;
      scroll-behavior: smooth;
    }
    .empty {
      min-height: 100%; display: grid; place-content: center; text-align: center; color: var(--muted);
    }
    .empty strong { color: var(--text); font: 600 1.15rem Georgia, "Yu Mincho", serif; }
    .message {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 14px;
      margin-bottom: 22px;
      animation: enter .22s ease-out both;
    }
    .speaker {
      align-self: start; padding: 5px 8px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); text-align: center; font-size: .75rem; font-weight: 700;
    }
    .message.player .speaker { color: #b7cbff; border-color: #496aa8; }
    .message.gm .speaker { color: var(--cyan); border-color: #39736f; }
    .message.system .speaker { color: var(--amber); border-color: #775d36; }
    .message-body { min-width: 0; line-height: 1.75; }
    .message.gm .message-body { font-family: Georgia, "Yu Mincho", serif; font-size: 1.02rem; }
    .result-box, .notice {
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(26, 48, 75, .6); white-space: pre-wrap;
    }
    .result-box { border-left: 3px solid var(--amber); }
    .notice.error { border-color: #874f4d; color: #ffd2cc; background: rgba(90, 37, 38, .25); }
    .pending { display: flex; gap: 12px; align-items: center; color: var(--muted); }
    .spinner {
      width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%;
      border: 2px solid #38506b; border-top-color: var(--cyan); animation: spin .8s linear infinite;
    }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .choice {
      padding: 8px 11px; color: var(--cyan); border: 1px solid #39736f;
      border-radius: 8px; background: rgba(23, 63, 73, .42);
    }

    .composer { padding: 17px 20px 20px; border-top: 1px solid var(--line); background: rgba(7, 18, 31, .72); }
    .composer-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .send {
      min-width: 118px; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 9px;
      color: #07151f; background: linear-gradient(135deg, var(--cyan), #8ee9e4);
      font-weight: 800; box-shadow: 0 8px 22px rgba(62, 188, 182, .2);
    }
    .shortcut { margin: 7px 2px 0; color: var(--muted); font-size: .75rem; text-align: right; }

    .status-list { margin: 20px 0 0; padding: 0; list-style: none; }
    .status-list li { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .status-list span { display: block; color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
    .status-list strong { font-size: .92rem; overflow-wrap: anywhere; }
    .phase { color: var(--cyan); }
    .state-version { color: var(--amber); }
    .recovery { margin-top: 18px; padding: 12px; border: 1px solid #775d36; border-radius: 9px; color: #ffd49a; background: rgba(83, 57, 24, .25); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes enter { from { opacity: 0; transform: translateY(5px); } }

    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .setup, .turn-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 18px; }
      .setup h2, .setup > p, .turn-panel h2, .turn-panel > p, .status-list, .recovery { grid-column: 1 / -1; }
      .story { min-height: 680px; grid-row: 2; }
      .turn-panel { grid-row: 3; }
    }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; }
      .brand { display: block; }
      .brand span { display: block; margin-top: 7px; }
      .shell { padding: 10px; }
      .setup, .turn-panel { display: block; padding: 18px; }
      .story { min-height: 72vh; }
      .timeline { padding: 18px; }
      .message { grid-template-columns: 58px 1fr; gap: 10px; }
      .composer-row { grid-template-columns: 1fr; }
      .send { width: 100%; }
      .shortcut { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>AI_RPG</strong><span>言葉が、もうひとつの世界を拓く</span></div>
    <div id="connection" class="connection" data-state="checking">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connection-label">APIを確認中</span>
    </div>
  </header>

  <main class="shell">
    <aside class="panel setup" aria-labelledby="setup-heading">
      <h2 id="setup-heading">ゲーム設定</h2>
      <p class="hint">Campaignと操作するActorを指定します。開発時はREADMEの固定IDを利用できます。</p>
      <div class="field">
        <label for="campaign-id">Campaign ID</label>
        <input id="campaign-id" name="campaign-id" type="text" autocomplete="off" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
      <div class="field">
        <label for="actor-id">Actor ID</label>
        <input id="actor-id" name="actor-id" type="text" autocomplete="off" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
    </aside>

    <section class="panel story" aria-labelledby="story-heading">
      <div class="story-head">
        <h1 id="story-heading">物語</h1>
        <p>確定した判定と描写が、ここに時系列で残ります。</p>
      </div>
      <ol id="timeline" class="timeline" aria-label="物語の履歴">
        <li id="empty-state" class="empty">
          <p><strong>最初の行動を選んでください。</strong><br>周囲を調べる、話す、進むなど自由に入力できます。</p>
        </li>
      </ol>
      <form id="composer" class="composer">
        <label for="action-text">行動を入力</label>
        <div class="composer-row">
          <textarea id="action-text" name="action-text" maxlength="8000" required placeholder="例: 周囲を注意深く観察する"></textarea>
          <button id="send-action" class="send" type="submit">送信</button>
        </div>
        <p class="shortcut">Ctrl + Enterでも送信できます</p>
      </form>
    </section>

    <aside class="panel turn-panel" aria-labelledby="turn-heading">
      <h2 id="turn-heading">Turn status</h2>
      <p class="hint">現在のTurnの処理状況</p>
      <ul class="status-list">
        <li><span>Route</span><strong id="route-value">—</strong></li>
        <li><span>Resolution</span><strong id="resolution-value" class="phase">待機中</strong></li>
        <li><span>Narration</span><strong id="narration-value">待機中</strong></li>
        <li><span>State version</span><strong id="version-value" class="state-version">0</strong></li>
        <li><span>Turn ID</span><strong id="turn-value">—</strong></li>
      </ul>
      <div id="recovery" class="recovery" hidden></div>
    </aside>
  </main>

  <div id="live-status" class="visually-hidden" role="status" aria-live="polite"></div>

  <script src="/static/play-state.js"></script>
  <script>
    const ui = Object.fromEntries([
      "campaign-id", "actor-id", "action-text", "send-action", "composer", "timeline",
      "empty-state", "connection", "connection-label", "route-value", "resolution-value",
      "narration-value", "version-value", "turn-value", "recovery", "live-status"
    ].map(id => [id, document.getElementById(id)]));

    const labels = {
      pending: "待機中", resolving: "判定中", committed: "確定済み",
      not_applied: "適用なし", failed: "失敗", generating: "描写を生成中",
      completed: "完了", fallback: "復旧済み", narrative: "Narrative", mechanical: "Mechanical"
    };
    const errors = {
      UNAUTHENTICATED: "認証が設定されていません。開発時はAPIを --dev-principal 付きで起動してください。",
      FORBIDDEN: "このCampaignまたはActorを操作する権限がありません。",
      TURN_IN_PROGRESS: "前のTurnを処理中です。完了後にもう一度送信してください。",
      STATE_VERSION_CONFLICT: "世界の状態が更新されたため行動は送信していません。内容を確認してから再送してください。",
      CHOICE_NOT_AVAILABLE: "その選択肢は現在利用できません。",
      IDEMPOTENCY_CONFLICT: "同じrequest IDに異なる入力が使われました。"
    };
    let busy = false;
    let stateVersion = null;
    let stateCampaignId = null;
    const renderedTurns = new Set();
    localStorage.removeItem("ai-rpg-state-version");
    ui["campaign-id"].value = localStorage.getItem("ai-rpg-campaign") || "";
    ui["actor-id"].value = localStorage.getItem("ai-rpg-actor") || "";
    ui["version-value"].textContent = "—";

    function announce(message) {
      ui["live-status"].textContent = message;
    }

    function setBusy(value) {
      busy = value;
      ui["send-action"].disabled = value;
      ui["action-text"].disabled = value;
      ui["campaign-id"].disabled = value;
      ui["actor-id"].disabled = value;
      document.querySelectorAll(".choice").forEach(button => { button.disabled = value; });
      ui["send-action"].textContent = value ? "処理中…" : "送信";
    }

    function addMessage(speaker, kind, content, className = "") {
      ui["empty-state"]?.remove();
      const item = document.createElement("li");
      item.className = `message ${kind}`;
      if (className) item.dataset.role = className;
      const badge = document.createElement("span");
      badge.className = "speaker";
      badge.textContent = speaker;
      const body = document.createElement("div");
      body.className = "message-body";
      if (content instanceof Node) body.append(content); else body.textContent = content;
      item.append(badge, body);
      ui.timeline.append(item);
      item.scrollIntoView({ block: "nearest" });
      return body;
    }

    function processingMessage() {
      const wrap = document.createElement("div");
      wrap.className = "notice pending";
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      spinner.setAttribute("aria-hidden", "true");
      const text = document.createElement("span");
      text.textContent = "判定を開始しています…";
      wrap.append(spinner, text);
      addMessage("SYSTEM", "system", wrap, "processing");
    }

    function showError(message) {
      const box = document.createElement("div");
      box.className = "notice error";
      box.textContent = message;
      addMessage("SYSTEM", "system", box);
      announce(message);
    }

    function showRetry(message, retry) {
      const box = document.createElement("div");
      box.className = "notice error";
      const text = document.createElement("span");
      text.textContent = message;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = "同じ送信を再試行";
      button.addEventListener("click", retry);
      box.append(text, document.createElement("br"), button);
      addMessage("SYSTEM", "system", box);
      announce(message);
    }

    function setStateVersion(campaignId, version) {
      stateCampaignId = campaignId;
      stateVersion = version;
      ui["version-value"].textContent = String(version);
    }

    function resetView() {
      renderedTurns.clear();
      ui.timeline.replaceChildren();
      const empty = document.createElement("li");
      empty.id = "empty-state";
      empty.className = "empty";
      empty.textContent = "Campaignの状態を読み込んでいます。";
      ui.timeline.append(empty);
      ui["route-value"].textContent = "—";
      ui["resolution-value"].textContent = "待機中";
      ui["narration-value"].textContent = "待機中";
      ui["turn-value"].textContent = "—";
      ui["version-value"].textContent = "—";
      stateCampaignId = null;
      stateVersion = null;
    }

    function updateStatus(turn) {
      ui["route-value"].textContent = labels[turn.route] || "—";
      ui["resolution-value"].textContent = labels[turn.resolution_status] || turn.resolution_status;
      ui["narration-value"].textContent = labels[turn.narration_status] || turn.narration_status;
      ui["turn-value"].textContent = turn.turn_id;
      if (turn.committed_state_version !== null) {
        setStateVersion(ui["campaign-id"].value.trim(), turn.committed_state_version);
      }
      if (turn.recovery?.fallback) {
        ui.recovery.hidden = false;
        ui.recovery.textContent = `自動復旧: ${turn.recovery.reason}`;
      } else {
        ui.recovery.hidden = true;
      }
    }

    function renderCompleted(turn) {
      document.querySelector('[data-role="processing"]')?.remove();
      if (renderedTurns.has(turn.turn_id)) return;
      renderedTurns.add(turn.turn_id);
      for (const action of turn.action_results || []) {
        const result = action.result;
        const lines = [];
        if (result.facts) lines.push(...result.facts);
        if (result.dice) {
          for (const die of result.dice) {
            lines.push(`${die.expression}: ${die.rolls.join(", ")} ${die.modifier >= 0 ? "+" : ""}${die.modifier} = ${die.total}`);
          }
        }
        if (result.reason) lines.push(`適用なし: ${result.reason}`);
        const box = document.createElement("div");
        box.className = "result-box";
        box.textContent = lines.join("\n") || "判定結果が確定しました。";
        addMessage("RESULT", "system", box);
      }
      if (turn.narration) addMessage("GM", "gm", turn.narration);
      if (turn.choices?.length) {
        const choices = document.createElement("div");
        choices.className = "choices";
        for (const choice of turn.choices) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice";
          button.textContent = choice.label;
          button.addEventListener("click", () => submitTurn({ kind: "choice", choice_id: choice.id }, choice.label));
          choices.append(button);
        }
        const lastGm = ui.timeline.lastElementChild?.querySelector(".message-body");
        (lastGm || ui.timeline).append(choices);
      }
      const summary = turn.recovery?.fallback ? "復旧用描写でTurnが完了しました。" : "Turnが完了しました。";
      announce(summary);
    }

    function terminal(turn) {
      return ["completed", "fallback"].includes(turn.narration_status) &&
        ["committed", "not_applied", "failed"].includes(turn.resolution_status);
    }

    function observeTurn(turn) {
      updateStatus(turn);
      const pendingText = document.querySelector('[data-role="processing"] .pending span:last-child');
      if (pendingText) pendingText.textContent = turn.resolution_status === "committed" ? "描写を生成しています…" : "判定を処理しています…";
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      if (!response.ok) {
        let code = "UNKNOWN";
        try { code = (await response.json()).detail?.code || code; } catch (_) { /* no body */ }
        const error = new Error(errors[code] || `API error (${response.status})`);
        error.status = response.status;
        error.code = code;
        throw error;
      }
      return response.json();
    }

    async function refreshCampaignState(campaignId, { resume = false } = {}) {
      const state = await api(`/campaigns/${encodeURIComponent(campaignId)}/state`);
      if (ui["campaign-id"].value.trim() !== campaignId) return state;
      setStateVersion(campaignId, state.state_version);
      if (state.latest_turn) {
        updateStatus(state.latest_turn);
        if (resume) await resumeTurn(campaignId, state.latest_turn);
      }
      return state;
    }

    async function pollTurn(campaignId, turnId) {
      while (true) {
        const turn = await api(`/campaigns/${encodeURIComponent(campaignId)}/turns/${encodeURIComponent(turnId)}`);
        observeTurn(turn);
        if (terminal(turn)) return turn;
        await new Promise(resolve => setTimeout(resolve, 750));
      }
    }

    function waitForTurn(campaignId, turnId) {
      if (!("EventSource" in window)) return pollTurn(campaignId, turnId);
      return new Promise((resolve, reject) => {
        let settled = false;
        let polling = false;
        const events = new EventSource(`/campaigns/${encodeURIComponent(campaignId)}/events`);
        const fallbackTimer = setTimeout(startPolling, 1500);

        function finish(turn) {
          if (settled) return;
          settled = true;
          clearTimeout(fallbackTimer);
          events.close();
          resolve(turn);
        }

        async function startPolling() {
          if (settled || polling) return;
          polling = true;
          ui["connection-label"].textContent = "Pollingで追跡";
          try {
            finish(await pollTurn(campaignId, turnId));
          } catch (error) {
            if (!settled) reject(error);
          }
        }

        events.addEventListener("turn.updated", event => {
          try {
            const turn = JSON.parse(event.data).payload?.turn;
            if (!turn || turn.turn_id !== turnId) return;
            observeTurn(turn);
            if (terminal(turn)) finish(turn);
          } catch (_) { /* malformed public event is ignored; polling remains available */ }
        });
        events.onopen = () => { ui["connection-label"].textContent = "SSE接続済み"; };
        events.onerror = () => {
          events.close();
          startPolling();
        };
      });
    }

    async function resumeTurn(campaignId, turn) {
      setBusy(true);
      processingMessage();
      try {
        observeTurn(turn);
        const completed = terminal(turn) ? turn : await waitForTurn(campaignId, turn.turn_id);
        renderCompleted(completed);
      } catch (error) {
        document.querySelector('[data-role="processing"]')?.remove();
        showError(error instanceof Error ? error.message : "Turnの追跡に失敗しました。");
      } finally {
        setBusy(false);
      }
    }

    async function continuePending(pending, showPlayer) {
      setBusy(true);
      if (showPlayer) addMessage("YOU", "player", pending.displayText);
      processingMessage();
      announce("Turnを送信しました。判定中です。");
      try {
        let accepted;
        if (pending.turnId) {
          accepted = await api(
            `/campaigns/${encodeURIComponent(pending.campaignId)}/turns/${encodeURIComponent(pending.turnId)}`
          );
        } else {
          accepted = await api(`/campaigns/${encodeURIComponent(pending.campaignId)}/turns`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pending.body)
          });
          pending = { ...pending, turnId: accepted.turn_id };
          AiRpgPending.save(localStorage, pending);
        }
        updateStatus(accepted);
        const completed = terminal(accepted) ? accepted : await waitForTurn(pending.campaignId, accepted.turn_id);
        renderCompleted(completed);
        AiRpgPending.clear(localStorage);
        if (pending.body.content.kind === "text") ui["action-text"].value = "";
      } catch (error) {
        document.querySelector('[data-role="processing"]')?.remove();
        if (["STATE_VERSION_CONFLICT", "TURN_IN_PROGRESS", "CHOICE_NOT_AVAILABLE", "IDEMPOTENCY_CONFLICT"].includes(error?.code)) {
          AiRpgPending.clear(localStorage);
          try { await refreshCampaignState(pending.campaignId, { resume: error.code === "TURN_IN_PROGRESS" }); } catch (_) { /* original error remains primary */ }
          showError(error.message);
        } else {
          const message = error instanceof Error ? error.message : "Turnの処理に失敗しました。";
          showRetry(message, () => {
            const saved = AiRpgPending.load(localStorage);
            if (saved) continuePending(saved, false);
          });
        }
        if (error?.status === 401) {
          ui.connection.dataset.state = "error";
          ui["connection-label"].textContent = "認証が必要";
        }
      } finally {
        setBusy(false);
        ui["action-text"].focus();
      }
    }

    async function submitTurn(content, displayText) {
      if (busy) return;
      const campaignId = ui["campaign-id"].value.trim();
      const actorId = ui["actor-id"].value.trim();
      if (!campaignId || !actorId || !displayText.trim()) {
        showError("Campaign ID、Actor ID、行動を入力してください。");
        return;
      }
      localStorage.setItem("ai-rpg-campaign", campaignId);
      localStorage.setItem("ai-rpg-actor", actorId);
      const existing = AiRpgPending.load(localStorage);
      if (existing) {
        showRetry("前の送信結果が未確認です。新しい行動の前に同じ送信を再試行してください。", () => continuePending(existing, false));
        return;
      }
      setBusy(true);
      let pending = null;
      try {
        const knownVersion = stateCampaignId === campaignId ? stateVersion : null;
        const current = await refreshCampaignState(campaignId);
        if (knownVersion !== null && current.state_version !== knownVersion) {
          showError("世界の状態が更新されました。行動内容を確認してから再送してください。");
          return;
        }
        pending = AiRpgPending.create({
          campaignId,
          actorId,
          displayText,
          content,
          stateVersion: current.state_version,
          requestId: crypto.randomUUID()
        });
        AiRpgPending.save(localStorage, pending);
      } catch (error) {
        showError(error instanceof Error ? error.message : "Turnの処理に失敗しました。");
      } finally {
        setBusy(false);
      }
      if (pending) await continuePending(pending, true);
    }

    ui.composer.addEventListener("submit", event => {
      event.preventDefault();
      const text = ui["action-text"].value;
      submitTurn({ kind: "text", text }, text);
    });
    ui["action-text"].addEventListener("keydown", event => {
      if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        ui.composer.requestSubmit();
      }
    });
    ui["campaign-id"].addEventListener("change", async () => {
      if (busy) return;
      const campaignId = ui["campaign-id"].value.trim();
      localStorage.setItem("ai-rpg-campaign", campaignId);
      resetView();
      if (!campaignId) return;
      try {
        await refreshCampaignState(campaignId, { resume: true });
      } catch (error) {
        showError(error instanceof Error ? error.message : "Campaignの読込みに失敗しました。");
      }
    });

    async function restoreSession() {
      const pending = AiRpgPending.load(localStorage);
      if (pending) {
        ui["campaign-id"].value = pending.campaignId;
        ui["actor-id"].value = pending.actorId;
        await refreshCampaignState(pending.campaignId);
        await continuePending(pending, false);
        return;
      }
      const campaignId = ui["campaign-id"].value.trim();
      if (campaignId) await refreshCampaignState(campaignId, { resume: true });
    }

    restoreSession().catch(error => {
      showError(error instanceof Error ? error.message : "保存済みSessionの復元に失敗しました。");
    });

    fetch("/health")
      .then(response => {
        if (!response.ok) throw new Error();
        ui.connection.dataset.state = "ok";
        ui["connection-label"].textContent = "API接続済み";
      })
      .catch(() => {
        ui.connection.dataset.state = "error";
        ui["connection-label"].textContent = "API未接続";
      });
  </script>
</body>
</html>
